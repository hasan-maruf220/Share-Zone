<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room | Sharing Zone</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- Load Socket.IO from CDN or local server -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="room-body">
  <div class="background-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Full screen loading overlay initially hidden -->
  <div id="loadingOverlay" class="hidden">
    <div class="spinner"></div>
    <p>Loading Workspace...</p>
  </div>

  <nav class="room-nav glass-panel">
    <div class="room-info">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      <div id="roomIdBadge" class="room-id-badge" role="button" tabindex="0" aria-label="Copy room ID">
        <span id="roomIdDisplay">Loading...</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </div>
    </div>
    <div class="room-controls">
      <button id="leaveRoomBtn" class="btn btn-secondary btn-small">Leave Room</button>
      <button id="closeRoomBtn" class="btn btn-danger btn-small hidden">Close & Delete Room</button>
    </div>
  </nav>

  <main class="workspace-grid">
    <!-- Chat Section -->
    <section class="chat-container glass-panel">
      <div class="chat-header">
        Live Chat
      </div>
      <div id="chatMessages" class="chat-messages">
        <!-- Messages will be injected here -->
      </div>
      <div class="chat-input-area">
        <form id="chatForm" class="chat-form">
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
          <button type="submit" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
      </div>
    </section>

    <!-- Files Section -->
    <section class="files-container glass-panel">
      <div class="files-header">
        Shared Files
      </div>
      
      <div id="uploadZone" class="upload-zone">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <p>Drag & drop files here<br>or click to browse</p>
        <span class="upload-hint">Max 15MB. Docs, Images, ZIP only.</span>
        <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.pptx,.ppt,.txt,.jpg,.jpeg,.png,.gif,.webp,.zip">
      </div>

      <div id="filesList" class="files-list">
        <p id="filesEmptyState" class="files-empty-state">No files yet. Drop a file above to share with your room.</p>
        <!-- Files will be injected here -->
      </div>
    </section>
  </main>

  <!-- Error Toast -->
  <div id="toast" class="error-msg toast-msg hidden" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <p class="footer-name">Maruf Hossain</p>
    <p class="footer-info">Daffodil International University</p>
    <p class="footer-info">Department of Software Engineering</p>
  </footer>

  <script src="/js/room.js"></script>
</body>
</html>
